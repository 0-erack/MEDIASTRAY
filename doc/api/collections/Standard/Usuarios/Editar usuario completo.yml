info:
  name: Editar usuario completo
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{url_backend}}/user/edit"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: X-session-token
      value: "{{session_token}}"
    - name: X-auth-api
      value: "{{api_token}}"
  body:
    type: json
    data: |-
      {
        "newData": {
          "email": "holaques@gma.co",
          "name": "Holaque uno s",
          "nickname": "holaque1s",
          "password": "Ja.12121212",
          "birthdate": "1773211189389",
          "changePassword": true,
          "oldPassword": "Ja.12121212",
          "urlPhoto": "https://fotos.com/2",
          "description": "auivybk"
        }
      }
  auth:
    type: bearer
    token: "{{session_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Endpoint privado con identificación
  Editar el usuario actual
  ## Recibe
  Datos a editar en el objeto newData: email, name, nickname, password, birthdate, changePassword, oldPassword, urlPhoto, description
  Si se van a editar el nickname o la contraseña, oldPassword tiene que estar presente y correcto
  ## Devuelve
  Token de sesión y datos del usuario actualizados
