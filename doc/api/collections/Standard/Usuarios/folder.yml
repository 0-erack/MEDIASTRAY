info:
  name: Usuarios
  type: folder
  seq: 1

request:
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: X-session-token
      value: "{{session_token}}"
    - name: X-auth-api
      value: "{{api_token}}"
  auth: inherit
  scripts:
    - type: after-response
      code: |-
        const sessionToken = res.getBody()?.data?.sessionToken;

        if (sessionToken) {
          bru.setEnvVar("session_token", sessionToken);
        }

docs:
  content: |-
    # Rutas de los usuarios
    Endpoitns relacionados con la gestión de usuarios
  type: text/markdown
