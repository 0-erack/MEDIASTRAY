info:
  name: Crear usuario
  type: http
  seq: 1

http:
  method: POST
  url: "{{url_backend}}/prueba"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: X-session-token
      value: "{{session_token}}"
    - name: X-auth-api
      value: OUI2LzdfMUdbcy4cR01DXXQXKYaXxCf1
  auth:
    type: bearer
    token: "{{session_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
