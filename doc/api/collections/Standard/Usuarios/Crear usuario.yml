info:
  name: Crear usuario
  type: http
  seq: 1

http:
  method: POST
  url: "{{url_backend}}/user/create"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: X-session-token
      value: "{{session_token}}"
    - name: X-auth-api
      value: "{{api_token}}"
  body:
    type: json
    data: |-
      {
        "user": {
          "email": "holaque@gma.co",
          "name": "Holaque uno",
          "nickname": "holaque1",
          "password": "Ja.12121212",
          "birthdate": "1773252289389"
          
        }
      }
  auth:
    type: bearer
    token: "{{session_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Ruta privada para crear un usuario
