info:
  name: Ver usuario privado
  type: http
  seq: 9

http:
  method: GET
  url: "{{url_backend}}/user/me"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: X-session-token
      value: "{{session_token}}"
    - name: X-auth-api
      value: "{{api_token}}"
  body:
    type: json
    data: ""
  auth:
    type: bearer
    token: "{{session_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Endpoint privado con identificación
  Ver el usuario actual
  ## Devuelve
  Los datos del usuario actual
