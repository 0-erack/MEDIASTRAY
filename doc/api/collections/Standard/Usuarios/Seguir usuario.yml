info:
  name: Seguir usuario
  type: http
  seq: 10

http:
  method: POST
  url: "{{url_backend}}/user/follow"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: X-session-token
      value: "{{session_token}}"
    - name: X-auth-api
      value: "{{api_token}}"
  body:
    type: json
    data: |-
      {
        "cantidad": 1,
        "id_b": "88028721-7a94-4bc6-831e-267a7452612c"
      }
  auth:
    type: bearer
    token: "{{session_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Ruta privada para crear un usuario
