info:
  name: Seguir usuario
  type: http
  seq: 10

http:
  method: POST
  url: "{{url_backend}}/user/follow"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: X-session-token
      value: "{{session_token}}"
    - name: X-auth-api
      value: "{{api_token}}"
  body:
    type: json
    data: |-
      {
        "amount": 1,
        "id_b": "85ac9432-426f-479f-89f2-52cd92e18063"
      }
  auth:
    type: bearer
    token: "{{session_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Endpoint privado con identificación
  Seguir a un usuario
  ## Recibe
  -1, 0 o 1 en amount y el UUID del usuario a seguir en id_b
  ## Devuelve
  Última información del seguimiento
