info:
  name: Login usuario
  type: http
  seq: 2

http:
  method: POST
  url: "{{url_backend}}/user/login"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: X-session-token
      value: "{{session_token}}"
    - name: X-auth-api
      value: "{{api_token}}"
  body:
    type: json
    data: |-
      {
        "credentials": {
          "identification": "holaque1",
          "password": "Ja.12121212"
        }
      }
  auth:
    type: bearer
    token: "{{session_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

