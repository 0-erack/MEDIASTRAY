info:
  name: Validar session token
  type: http
  seq: 5

http:
  method: GET
  url: "{{url_backend}}/auth/sessionToken"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: X-session-token
      value: "{{session_token}}"
    - name: X-auth-api
      value: OUI2LzdfMUdbcy4cR01DXXQXKYaXxCf1
    - name: X-auth-session
      value: "{{session_token}}"
  auth:
    type: bearer
    token: "{{session_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Comprueba que el token de sesión actual sea válido
  ## Devuelve
  La confirmación
