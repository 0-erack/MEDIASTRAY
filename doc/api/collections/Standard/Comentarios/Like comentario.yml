info:
  name: Like comentario
  type: http
  seq: 5

http:
  method: POST
  url: "{{url_backend}}/comment/like"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: X-session-token
      value: "{{session_token}}"
    - name: X-auth-api
      value: "{{api_token}}"
  body:
    type: json
    data: |-
      {
        "id": "5269219f-4f02-4941-8cbe-3b2d9994b146",
        "quantity": 1
      }
  auth:
    type: bearer
    token: "{{session_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Ruta privada para crear un usuario
