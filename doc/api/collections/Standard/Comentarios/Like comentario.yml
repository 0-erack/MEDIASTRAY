info:
  name: Like comentario
  type: http
  seq: 5

http:
  method: POST
  url: "{{url_backend}}/comment/like"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: X-session-token
      value: "{{session_token}}"
    - name: X-auth-api
      value: "{{api_token}}"
  body:
    type: json
    data: |-
      {
        "id": "1eff10de-65a3-4e39-be51-94dc0645e117",
        "amount": 1
      }
  auth:
    type: bearer
    token: "{{session_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Endpoint privado con identificación
  Dar o quitar like a un comentario
  ## Recibe
  UUID del comentario a alterar el like y amount con -1, 0 o 1
  ## Devuelve
  Estado actual del like sobre este comentario
