info:
  name: Ver comentario personalmente
  type: http
  seq: 3

http:
  method: GET
  url: "{{url_backend}}/comment/personal/1/game_854cbb68-117f-44ed-88b4-8a82112e1bb3?page=0&pageSub=0"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: X-session-token
      value: "{{session_token}}"
    - name: X-auth-api
      value: "{{api_token}}"
  params:
    - name: page
      value: "0"
      type: query
    - name: pageSub
      value: "0"
      type: query
  body:
    type: json
    data: ""
  auth:
    type: bearer
    token: "{{session_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Endpoint público
  Ver un comentario personalmente
  ## Recibe
  El tipo de búsqueda, _ y el UUID a buscar, y opcionalmente la página en la que buscar y la página en la que ver las respuestas
  ## Devuelve
  Datos del comentario y sus respuestas, y si tiene el like del usuarioa cutal
