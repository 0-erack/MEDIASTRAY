info:
  name: Comentar juego
  type: http
  seq: 2

http:
  method: POST
  url: "{{url_backend}}/comment/game/854cbb68-117f-44ed-88b4-8a82112e1bb3"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: X-session-token
      value: "{{session_token}}"
    - name: X-auth-api
      value: "{{api_token}}"
  body:
    type: json
    data: |-
      {
        "content": "# hola \n hola"
      }
  auth:
    type: bearer
    token: "{{session_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Ruta privada para crear un usuario
