info:
  name: Comentar juego
  type: http
  seq: 2

http:
  method: POST
  url: "{{url_backend}}/comment/game/d0dc134c-8959-4d62-8c25-0b72b6d8c7fd"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: X-session-token
      value: "{{session_token}}"
    - name: X-auth-api
      value: "{{api_token}}"
  body:
    type: json
    data: |-
      {
        "content": "# hola \n hola"
      }
  auth:
    type: bearer
    token: "{{session_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Endpoint privado con identificación
  Comentar un objeto
  ## Recibe
  UUID del juego a comentar y contenido del comentario en content
  ## Devuelve
  Confirmación de que todo ha ido bien o error
