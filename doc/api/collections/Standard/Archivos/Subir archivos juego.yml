info:
  name: Subir archivos juego
  type: http
  seq: 1

http:
  method: POST
  url: "{{url_backend}}/gameFile"
  headers:
    - name: Accept
      value: application/json
    - name: X-session-token
      value: "{{session_token}}"
    - name: X-auth-api
      value: "{{api_token}}"
  body:
    type: multipart-form
    data:
      - name: id
        type: text
        value: 5efa6a35-0705-4385-8f72-19b034672dcb
        contentType: text
      - name: name
        type: text
        value: web
        contentType: text
      - name: archivo
        type: file
        value:
          - /home/yete/Escritorio/MEDIASTRAY/games/index.zip
        contentType: file
  auth:
    type: bearer
    token: "{{session_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Endpoint privado con identificación
  Publicar un nuevo archivo de juego, al contrario del resto de peticiones, esta no admite JSON
  ## Recibe
  En formato MultiPartFormData (no JSON) el id del juego, el archivo y el name para la etiqueta
  ## Devuelve
  Confirmación de que todo ha ido bien o error
