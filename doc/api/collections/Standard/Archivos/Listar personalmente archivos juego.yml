info:
  name: Listar personalmente archivos juego
  type: http
  seq: 17

http:
  method: GET
  url: "{{url_backend}}/gameFile/personal/5efa6a35-0705-4385-8f72-19b034672dcb"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: X-session-token
      value: "{{session_token}}"
    - name: X-auth-api
      value: "{{api_token}}"
  body:
    type: json
    data: ""
  auth:
    type: bearer
    token: "{{session_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Endpoint privado con identificación
  Ver los archivos de tu juego
  ## Recibe
  UUID de un juego, puede ser privado si es del usuario actual
  ## Devuelve
  Lista informativa de los archivos del juego
