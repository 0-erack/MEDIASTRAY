info:
  name: Borrar archivos de juego (1)
  type: http
  seq: 3

http:
  method: DELETE
  url: "{{url_backend}}/gameFile"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: X-session-token
      value: "{{session_token}}"
    - name: X-auth-api
      value: "{{api_token}}"
  body:
    type: json
    data: |-
      {
        "id": "5efa6a35-0705-4385-8f72-19b034672dcb",
        "name": "web"
      }
  auth:
    type: bearer
    token: "{{session_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Endpoint privado con identificación
  Borrar el archivo de un juego
  ## Recibe
  El nombre del archivo en name y el juego en id
  ## Devuelve
  Confirmación de que ha ido bien o error
