info:
  name: Reportar objeto
  type: http
  seq: 19

http:
  method: POST
  url: "{{url_backend}}/report/854cbb68-117f-44ed-88b4-8a82112e1bb3"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: X-session-token
      value: "{{session_token}}"
    - name: X-auth-api
      value: "{{api_token}}"
  body:
    type: json
    data: |-
      {
        "type": "game",
        "text": "es malo"
      }
  auth:
    type: bearer
    token: "{{session_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Endpoint privado con identificación
  Reportar un objeto
  ## Recibe
  UUID del objeto a bloquear, type para saber que objeto es y text con la información del reporte
  ## Devuelve
  Confirmación de que todo ha ido bien o error
