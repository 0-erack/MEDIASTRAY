info:
  name: Reportar objeto anonimo
  type: http
  seq: 2

http:
  method: POST
  url: "{{url_backend}}/anonymous/report/e695ad8f-05ae-409e-9e35-653907e2639e"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: X-session-token
      value: "{{session_token}}"
    - name: X-auth-api
      value: "{{api_token}}"
  body:
    type: json
    data: |-
      {
        "type": "user",
        "text": "es malo"
      }
  auth:
    type: bearer
    token: "{{session_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Endpoint público
  Reportar un objeto de forma anónima, esta es la única operación que permite escribir contenido sin cuenta y está en pendiente revisión para bloquear según IP
  ## Recibe
  UUID del objeto a bloquear, type para saber que objeto es y text con la información del reporte
  ## Devuelve
  Confirmación de que todo ha ido bien o error
