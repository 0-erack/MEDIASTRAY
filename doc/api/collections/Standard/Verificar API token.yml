info:
  name: Verificar API token
  type: http
  seq: 3

http:
  method: GET
  url: "{{url_backend}}/auth/apiToken"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: X-session-token
      value: "{{session_token}}"
    - name: X-auth-api
      value: OUI2LzdfMUdbcy4cR01DXXQXKYaXxCf1
  auth:
    type: bearer
    token: "{{session_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Verifica si el token de API actual es válido
  ## Devuelve
  La confirmación
