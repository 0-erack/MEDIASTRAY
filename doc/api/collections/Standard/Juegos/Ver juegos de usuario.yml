info:
  name: Ver juegos de usuario
  type: http
  seq: 9

http:
  method: GET
  url: "{{url_backend}}/user/games/ba56e155-bf9c-4f6b-9212-c1031b16b6e0?page=0"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: X-session-token
      value: "{{session_token}}"
    - name: X-auth-api
      value: "{{api_token}}"
  params:
    - name: page
      value: "0"
      type: query
  body:
    type: json
    data: ""
  auth:
    type: bearer
    token: "{{session_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Endpoint público
  Ver los juegos de un usuario
  ## Recibe
  UUID del usuario a consultar y opcionalmente la página en la que mirar
  ## Devuelve
  Datos de los juegos de dicho usuario
