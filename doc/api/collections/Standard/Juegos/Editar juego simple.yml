info:
  name: Editar juego simple
  type: http
  seq: 8

http:
  method: PATCH
  url: "{{url_backend}}/game/edit/2a953d43-2e23-47ba-981f-05fd5f98d902"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: X-session-token
      value: "{{session_token}}"
    - name: X-auth-api
      value: "{{api_token}}"
  body:
    type: json
    data: |-
      {
        "newData": {
          "description": "ggj",
          "shortDescription": "ggj"
        }
      }
  auth:
    type: bearer
    token: "{{session_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

