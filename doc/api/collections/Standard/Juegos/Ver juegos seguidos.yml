info:
  name: Ver juegos seguidos
  type: http
  seq: 13

http:
  method: GET
  url: "{{url_backend}}/game/followed"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: X-session-token
      value: "{{session_token}}"
    - name: X-auth-api
      value: "{{api_token}}"
  body:
    type: json
    data: ""
  auth:
    type: bearer
    token: "{{session_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Endpoint privado con identificación
  Ver los juegos que sigue el usuario 
  ## Devuelve
  Datos de los juegos seguidos por el usuario actual
