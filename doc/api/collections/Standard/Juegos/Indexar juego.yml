info:
  name: Indexar juego
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{url_backend}}/game/index/5efa6a35-0705-4385-8f72-19b034672dcb"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: X-session-token
      value: "{{session_token}}"
    - name: X-auth-api
      value: "{{api_token}}"
  body:
    type: json
    data: |-
      {
        "state": true
      }
  auth:
    type: bearer
    token: "{{session_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Endpoint privado con identificación
  Alterar el parámetro de público de un juego
  ## Recibe
  UUID del juego a alterar y el nuevo valor en state
  ## Devuelve
  El estado actual del público del juego
