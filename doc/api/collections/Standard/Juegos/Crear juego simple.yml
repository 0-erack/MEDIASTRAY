info:
  name: Crear juego simple
  type: http
  seq: 4

http:
  method: POST
  url: "{{url_backend}}/game/create"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: X-session-token
      value: "{{session_token}}"
    - name: X-auth-api
      value: "{{api_token}}"
  body:
    type: json
    data: |-
      {
        "game": {
          "title": "el juego 2",
          "public": false
        }
      }
  auth:
    type: bearer
    token: "{{session_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Ruta privada para crear un usuario
