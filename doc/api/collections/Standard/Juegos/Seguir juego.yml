info:
  name: Seguir juego
  type: http
  seq: 11

http:
  method: POST
  url: "{{url_backend}}/game/follow"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: X-session-token
      value: "{{session_token}}"
    - name: X-auth-api
      value: "{{api_token}}"
  body:
    type: json
    data: |-
      {
        "id": "bf7aaf66-9dd3-4394-aae7-5d750ce37153",
        "quantity": 1
      }
  auth:
    type: bearer
    token: "{{session_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Ruta privada para crear un usuario
