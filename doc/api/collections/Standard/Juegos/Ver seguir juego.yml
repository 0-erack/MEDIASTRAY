info:
  name: Ver seguir juego
  type: http
  seq: 12

http:
  method: GET
  url: "{{url_backend}}/game/follow/bc6c3b55-c89d-4249-b2ca-18643c7eb87e"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: X-session-token
      value: "{{session_token}}"
    - name: X-auth-api
      value: "{{api_token}}"
  body:
    type: json
    data: ""
  auth:
    type: bearer
    token: "{{session_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Endpoint privado con identificación
  Ver si el usuario actual sigue a un juego
  ## Recibe
  UUID del juego a consultar
  ## Devuelve
  Información actual del seguimiento del usuario al juego
