info:
  name: Ver mis juegos
  type: http
  seq: 10

http:
  method: GET
  url: "{{url_backend}}/game/my?page=0&all=true"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: X-session-token
      value: "{{session_token}}"
    - name: X-auth-api
      value: "{{api_token}}"
  params:
    - name: page
      value: "0"
      type: query
    - name: all
      value: "true"
      type: query
  body:
    type: json
    data: ""
  auth:
    type: bearer
    token: "{{session_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Endpoint privado con identificación
  Ver todos los juegos del usuario actual
  ## Recibe
  Opcionalmente la página, o all si se quieren ver todos a la vez
  ## Devuelve
  Los juegos del usuario actual
