info:
  name: Crear juego
  type: http
  seq: 17

http:
  method: POST
  url: "{{url_backend}}/game/create"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: X-session-token
      value: "{{session_token}}"
    - name: X-auth-api
      value: "{{api_token}}"
  body:
    type: json
    data: |-
      {
        "game": {
          "title": "el juego",
          "cover1": "http://imagenes.com/1",
          "cover2": "http://imagenes.com/2",
          "cover3": "http://imagenes.com/3",
          "public": false,
          "version": "v1.0.0",
          "description": "adlfhasdfdhsfasfd",
          "shortDescription": "aksdfh",
          "genres": [],
          "tags": [],
          "languages": ["ES-es", "EN-us"],
          "warnings": [],
          "price": "3.00 €"
        }
      }
  auth:
    type: bearer
    token: "{{session_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Ruta privada para crear un usuario
