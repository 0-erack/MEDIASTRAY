info:
  name: 18 Comentar juego
  type: http
  seq: 17

http:
  method: POST
  url: "{{url_backend}}/comment/game/{{uuid_item1}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: X-session-token
      value: "{{session_token}}"
    - name: X-auth-api
      value: "{{api_token}}"
  body:
    type: json
    data: |-
      {
        "content": "# hola \n hola"
      }
  auth:
    type: bearer
    token: "{{session_token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        const data = res.getBody()?.data;
        if (data && data?.comment && data?.comment?.id) {
          bru.setEnvVar("uuid_item2", data.comment.id);
        } else {
          bru.setEnvVar("uuid_item2", "nada");
          console.log("Property not found in response body");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Endpoint privado con identificación
  Comentar un objeto
  ## Recibe
  UUID del juego a comentar y contenido del comentario en content
  ## Devuelve
  Confirmación de que todo ha ido bien o error
