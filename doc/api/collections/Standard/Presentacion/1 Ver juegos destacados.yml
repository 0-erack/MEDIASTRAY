info:
  name: 1 Ver juegos destacados
  type: http
  seq: 1

http:
  method: GET
  url: "{{url_backend}}/game/featured?page=0"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: X-session-token
      value: "{{session_token}}"
    - name: X-auth-api
      value: "{{api_token}}"
  params:
    - name: page
      value: "0"
      type: query
  body:
    type: json
    data: ""
  auth:
    type: bearer
    token: "{{session_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Endpoint público
  Ver los juegos destacados que hay ahora, esto podría provocar que se recalcule
  ## Recibe
  Opcionalmente la página en la que buscar
  ## Devuelve
  Datos de los juegos destacados
