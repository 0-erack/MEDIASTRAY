info:
  name: Presentacion
  type: folder
  seq: 4

request:
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: X-session-token
      value: "{{session_token}}"
    - name: X-auth-api
      value: "{{api_token}}"
  auth: inherit
  scripts:
    - type: after-response
      code: |-
        const sessionToken = res.getBody()?.data?.sessionToken;

        if (sessionToken) {
          bru.setEnvVar("session_token", sessionToken);
        }

docs:
  content: |-
    # Presentación y test
    Colección de endpoints secuenciales pensados para testing y presentación, representaría un flujo completo en la app
  type: text/markdown
