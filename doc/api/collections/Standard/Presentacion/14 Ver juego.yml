info:
  name: 14 Ver juego
  type: http
  seq: 13

http:
  method: GET
  url: "{{url_backend}}/game/{{uuid_item1}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: X-session-token
      value: "{{session_token}}"
    - name: X-auth-api
      value: "{{api_token}}"
  body:
    type: json
    data: ""
  auth:
    type: bearer
    token: "{{session_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Endpoint público
  Ver un juego
  ## Recibe
  UUID del juego a ver
  ## Devuelve
  Datos del juego
