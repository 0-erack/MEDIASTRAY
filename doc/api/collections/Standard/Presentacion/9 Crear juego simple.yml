runtime:
  scripts:
    - type: after-response
      code: |-
        const data = res.getBody()?.data;
        if (data && data?.game && data?.game?.id) {
          bru.setEnvVar("uuid_item1", data.game.id);
        } else {
          bru.setEnvVar("uuid_item1", "nada");
          console.log("Property not found in response body");
        }

settings:
  encodeUrl: true
  timeout: 0
