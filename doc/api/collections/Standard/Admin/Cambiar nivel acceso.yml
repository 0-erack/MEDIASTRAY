info:
  name: Cambiar nivel acceso
  type: http
  seq: 15

http:
  method: PATCH
  url: "{{url_backend}}/admin/userPermissions"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: X-session-token
      value: "{{session_token}}"
    - name: X-auth-api
      value: "{{api_token}}"
  body:
    type: json
    data: |-
      {
        "id": "db3e4b1f-6562-4da4-9861-b23a64e0c87e",
        "level": 3
      }
  auth:
    type: bearer
    token: "{{session_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Endpoint privado con identificación para administradores totales con sudo
  Alterar los permisos de otro usuario
  ## Recibe
  UUID del usuario a alterar y el nuevo nivel de permisos en level
  ## Devuelve
  Confirmación de que ha ido todo bien o error
