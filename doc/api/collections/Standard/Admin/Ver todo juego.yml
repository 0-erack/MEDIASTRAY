info:
  name: Ver todo juego
  type: http
  seq: 13

http:
  method: GET
  url: "{{url_backend}}/admin/game/551c2241-1daa-4479-8571-d7593cae7901"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: X-session-token
      value: "{{session_token}}"
    - name: X-auth-api
      value: "{{api_token}}"
  body:
    type: json
    data: ""
  auth:
    type: bearer
    token: "{{session_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Endpoint privado con identificación para moderadores
  Ver los datos de cualquier juego
  ## Recibe
  UUID del usuario a consultar (el que sea)
  ## Devuelve
  Datos completos de dicho juego
