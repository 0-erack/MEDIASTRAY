info:
  name: Ver todo usuario
  type: http
  seq: 12

http:
  method: GET
  url: "{{url_backend}}/admin/user/e695ad8f-05ae-409e-9e35-653907e2639e"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: X-session-token
      value: "{{session_token}}"
    - name: X-auth-api
      value: "{{api_token}}"
  body:
    type: json
    data: ""
  auth:
    type: bearer
    token: "{{session_token}}"

settings:
  encodeUrl: true
  timeout: 0
