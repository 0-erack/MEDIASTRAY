info:
  name: Comprobar admin
  type: http
  seq: 11

http:
  method: GET
  url: "{{url_backend}}/admin/check"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: X-session-token
      value: "{{session_token}}"
    - name: X-auth-api
      value: "{{api_token}}"
  body:
    type: json
    data: ""
  auth:
    type: bearer
    token: "{{session_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Endpoint para comprobar si con el session token actual se tienen permisos de administrador y moderador
  ## Devuelve
  Confirmación
