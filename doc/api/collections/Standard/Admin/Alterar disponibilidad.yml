info:
  name: Alterar disponibilidad
  type: http
  seq: 8

http:
  method: PATCH
  url: "{{url_backend}}/admin/alterAvailability"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: X-session-token
      value: "{{session_token}}"
    - name: X-auth-api
      value: "{{api_token}}"
  body:
    type: json
    data: |-
      {
        "id": "db3e4b1f-6562-4da4-9861-b23a64e0c87e",
        "new": 1
      }
  auth:
    type: bearer
    token: "{{session_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Endpoint privado con identificación para administradores
  Altera el parámetro de disponibilidad de un usuario
  ## Recibe
  UUID del usuario a alterar y el nuevo valor en new
  ## Devuelve
  Confirmación de que todo ha ido bien o error
