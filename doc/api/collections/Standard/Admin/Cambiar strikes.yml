info:
  name: Cambiar strikes
  type: http
  seq: 14

http:
  method: PATCH
  url: "{{url_backend}}/admin/strike"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: X-session-token
      value: "{{session_token}}"
    - name: X-auth-api
      value: "{{api_token}}"
  body:
    type: json
    data: |-
      {
        "id": "e695ad8f-05ae-409e-9e35-653907e2639e",
        "amount": 1
      }
  auth:
    type: bearer
    token: "{{session_token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  Endpoint privado con identificación para moderadores
  Alterar los strikes de un usuario usuario
  ## Recibe
  UUID del usuario a alterar y la cantidad de strikes a sumar en amoult
  ## Devuelve
  Cantidad de strikes actuales en el usuario
